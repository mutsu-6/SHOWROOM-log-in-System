services:
  showroom-keeper:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # 管理画面。コンテナ内では全アドレスで待ち受け、サーバーの外には公開しない (下の ports で 127.0.0.1 に限定)
      SHOWROOM_WEB_HOST: 0.0.0.0
      # スレッドごとにメモリの置き場を作らせない。置き場が 20 ほどに分かれ、使い終えたメモリを戻さずに
      # Python が 0.8GB まで膨らみ、配信のページを開けなくなった (2026-10-19)
      MALLOC_ARENA_MAX: "2"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data          # ログイン状態 (storage_state.json) の保存先
    shm_size: "1gb"
    # 停止時にログイン状態を保存してからブラウザを閉じるため、強制終了までの猶予を長めに取る
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
