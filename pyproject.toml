[project]
name = "showroom-keeper"
version = "0.1.0"
description = "SHOWROOM の視聴状態を維持し続ける常駐システム"
requires-python = ">=3.9"
dependencies = ["playwright>=1.45", "PyYAML>=6.0", "websockets>=12.0"]

[project.scripts]
showroom-keeper = "showroom_keeper.cli:main"

[tool.setuptools]
packages = ["showroom_keeper"]

[tool.setuptools.package-data]
showroom_keeper = ["admin.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
