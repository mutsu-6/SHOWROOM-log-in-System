# config.example.yaml をコピーして config.yaml を作成してください。
#   cp config.example.yaml config.yaml
# ※ サーバー (Docker) では config.yaml は使われません。各項目は .env に SHOWROOM_<項目名を大文字> で書けます
#   (例: login_check_interval: 7200 → SHOWROOM_LOGIN_CHECK_INTERVAL=7200)。環境変数は config.yaml より優先されます。

# 視聴を維持するルーム (URL または room_url_key)。ギフト記録 (record_rooms / events) だけなら空でもよい
rooms:
  - https://www.showroom-live.com/r/ROOM_URL_KEY

# 視聴はせず、配信が始まったら一度だけ入室するルーム (ページを開き、配信に参加したのを確かめてから閉じる)
enter_rooms: []

# 視聴はせずギフトだけ記録するルームとイベント (参加ルームすべて)。件数の上限はない
record_rooms: []
events: []
#  - https://www.showroom-live.com/event/イベント名

# 応援しているルーム (「分析」の基準) と、ギフターを調べるルーム。視聴はせず、累計ポイントランキングと
# イベントの貢献ランキングを research_days / research_times (既定は毎日 4:30) に集める
support_rooms: []
research_rooms: []
# SHOWROOM の全ルームの情報を少しずつ集め続ける (配信中・イベント参加のルームを見つけて、累計ランキングと
# 2015 年ごろからの貢献ランキングを取る)。state/research.db が数 GB になる (ディスクの空きに注意)
research_all: false
research_scan: true     # ルーム番号を 1 から順に 1 回だけ調べる (約 58 万回、1 秒に 1 回で約 7 日)
research_gap: 0.5       # 問い合わせの間隔 (秒)。混んでいれば自動で広げ、続けて失敗したら 1 時間止める
research_archive_gap: 6.0  # Internet Archive への問い合わせの間隔 (秒)

# ログイン情報。パスワードはこのファイルではなく環境変数
# SHOWROOM_ACCOUNT_ID / SHOWROOM_PASSWORD (.env) で渡すことを推奨します。
credentials:
  account_id: ""
  password: ""

# ログインセッション (Cookie) の保存先
state_file: state/storage_state.json

headless: true                # false にするとブラウザ画面を表示
browser_channel: chrome      # インストール済み Google Chrome を使用 (推奨)。"" で Playwright 付属 Chromium
# browser_executable: /path/to/chrome   # ブラウザの実行ファイルを直接指定する場合
# proxy: http://127.0.0.1:8080          # 未指定なら環境変数 HTTPS_PROXY を使用

status_poll_interval: 60      # 配信状態の確認間隔 (秒)
health_check_interval: 30     # 再生状況の確認間隔 (秒)
stall_threshold: 3            # 連続何回の再生停止でリロードするか
periodic_reload_minutes: 60   # 定期リロード間隔 (分)。0 で無効
login_check_interval: 7200    # ログイン状態の確認間隔 (秒)。1 ルームで 1 回問い合わせるだけでコメント等は送らない
save_state_minutes: 10        # セッション (Cookie) の保存間隔 (分)
# keep_open_when_offline: true # 配信していない時も全ルームのページを開いておく。false で配信中だけ開く。
                              # 未指定ならメモリに余裕がある時だけ開いておく (1 ルームにつき約 0.5GB 使う。ログイン維持はどちらでも同じ)
# disable_3d: true             # アバター等の 3D 描画を止めて CPU 負荷を下げる (既定: 画面非表示時のみ)
block_trackers: true          # 広告・アクセス解析の読み込みを遮断 (読み込みが速くなる)
block_media: false            # 映像を受信しない (帯域節約。視聴扱いにならない可能性あり)
video_quality: medium         # 視聴する画質 low (256x144) / medium (640x360) / original (配信そのまま) / auto (再生プレーヤー任せ)
gift_update_days: mon         # ギフトの一覧を SHOWROOM から取り直す曜日 (mon〜sun / 月〜日、毎日)
gift_update_times: "0:00,3:00,12:00,15:00,18:00"  # 取り直す時刻 (日本時間)。起動時にも取り直す
background_tabs: true         # 配信ページを空白のページの裏に開いて CPU を減らす (約 3 割)
viewer_count: true            # リアルタイム視聴者数を取得 (要ログイン)
viewer_count_interval: 60     # その間隔 (秒)
record_gifts: true            # 視聴中のルームのギフト (無料の星を含む) を記録する
mute: true
max_backoff: 300              # 障害時の再試行待ちの上限 (秒)
log_level: INFO

# 管理画面 (http://localhost:8080/)。web_port: 0 で無効
web_port: 8080
web_host: 127.0.0.1           # 既定では自分の PC からだけ開ける
# web_password: ""            # 設定すると localhost 以外からも開ける (環境変数 SHOWROOM_WEB_PASSWORD 推奨)
